<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="StudySprint — plan, focus, remember. The all-in-one study app that lives on your device." />
    <meta name="theme-color" content="#f6f0e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1320" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-512.png" />
    <title>StudySprint</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('ss.theme') || 'null');
        var d = document.documentElement;
        if (t) { d.dataset.theme = t.theme; d.dataset.accent = t.accent; d.dataset.look = t.look || 'clean'; d.dataset.round = t.round || 'soft'; }
        else { d.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper'; d.dataset.accent = 'rust'; d.dataset.look = 'paper'; d.dataset.round = 'sharp'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
