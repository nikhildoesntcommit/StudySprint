name: Feature request
description: Suggest an idea to make StudySprint better for studying
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the study situation or problem, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Today, Planner, Calendar, Focus, Notes, Flashcards, Practice, Grades, Insights, AI Tutor, Settings, New module]
